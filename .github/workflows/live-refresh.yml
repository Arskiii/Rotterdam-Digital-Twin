name: Live snapshot refresh

# Keeps the deployed platform fed with real Rotterdam state and folds every
# snapshot into the historical archive.
#
# This is the ONLY publisher of the `live` and `archive` branches. That matters:
# deploy.yml used to carry a second `live` job on its own */5 schedule, and the
# two raced. Each force-pushes the branch as a fresh root commit, so whichever
# went last decided the tree — and deploy.yml's version wrote no vercel.json,
# which meant Vercel's git integration tried to build a branch holding one JSON
# file and no app. Every such tick produced a failed deployment. The schedule
# and the live job are gone from deploy.yml; do not reintroduce them.
#
# Why the job loops internally rather than fetching once and exiting: a single
# tick gives a snapshot that is already a minute old by the time anyone loads
# the page. Refreshing on a 60-second cadence for the whole run means the city
# is a minute fresh continuously, and one manual dispatch with minutes=55 still
# covers most of an hour if the scheduler misbehaves.

on:
  schedule:
    # every 5 minutes; each run covers ~4 of those 5, so consecutive ticks tile
    # into continuous coverage rather than overlapping
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run should keep refreshing (1-55)"
        required: false
        default: "55"

permissions:
  contents: write # force-pushes `live`, commits to `archive`

concurrency:
  group: live-refresh
  # never kill a running refresh loop — a queued tick takes over when the
  # current one finishes, which is what keeps coverage continuous
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check out the archive branch
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git clone --depth 1 --branch archive "$REPO" /tmp/archive 2>/dev/null; then
            echo "archive branch checked out ($(du -sh /tmp/archive | cut -f1))"
          else
            echo "archive branch does not exist yet — starting one"
            mkdir -p /tmp/archive
            git -C /tmp/archive init -b archive --quiet
          fi
          git -C /tmp/archive config user.name "live-data bot"
          git -C /tmp/archive config user.email "actions@github.com"

      - name: Refresh loop
        env:
          MINUTES: ${{ github.event.inputs.minutes || '4' }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -uo pipefail
          MINUTES=$(echo "$MINUTES" | tr -cd '0-9')
          [ -z "$MINUTES" ] && MINUTES=4
          [ "$MINUTES" -gt 55 ] && MINUTES=55
          [ "$MINUTES" -lt 1 ] && MINUTES=1
          END=$(( $(date +%s) + MINUTES * 60 ))
          echo "refreshing every 60s for ${MINUTES} minute(s)"

          # Both published branches carry data, not an app. Without this Vercel
          # builds them on every push and fails, which is what filled the
          # dashboard with Error deployments.
          VERCEL_LIVE='{"git":{"deploymentEnabled":{"live":false}}}'
          VERCEL_ARCHIVE='{"git":{"deploymentEnabled":{"archive":false}}}'

          mkdir -p /tmp/live-branch
          printf '%s' "$VERCEL_ARCHIVE" > /tmp/archive/vercel.json
          ARCHIVE_PUSHED=$(date +%s)
          OK=0
          FAIL=0

          push_archive() {
            if [ -n "$(git -C /tmp/archive status --porcelain)" ]; then
              git -C /tmp/archive add -A
              git -C /tmp/archive commit -q -m "archive $(date -u +%Y-%m-%dT%H:%MZ)"
              # append-mostly, so a losing race just means the next push carries
              # both sides — rebase rather than force
              git -C /tmp/archive pull --rebase -q origin archive 2>/dev/null || true
              if git -C /tmp/archive push -q "$REPO_URL" archive 2>&1; then
                echo "  archive pushed"
              else
                echo "  archive push failed (will retry next window)"
              fi
            fi
          }

          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)
            if node scripts/fetch-live.mjs --out /tmp/live.json; then
              OK=$((OK + 1))
              cp /tmp/live.json /tmp/live-branch/live.json
              printf '%s' "$VERCEL_LIVE" > /tmp/live-branch/vercel.json
              ( cd /tmp/live-branch
                rm -rf .git
                git init -b live --quiet
                git config user.name "live-data bot"
                git config user.email "actions@github.com"
                git add live.json vercel.json
                git commit -q -m "live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                # one root commit, force-pushed: the live branch is a current
                # value, not a log, so its history must never grow
                git push -q --force "$REPO_URL" live ) || echo "  live push failed"
              node scripts/archive-live.mjs --snapshot /tmp/live.json --dir /tmp/archive || true
            else
              FAIL=$((FAIL + 1))
              echo "  fetch failed ($FAIL so far)"
            fi

            # push the archive on a slower clock than the snapshot so the branch
            # collects one commit per ~10 min instead of one per minute
            if [ $(( $(date +%s) - ARCHIVE_PUSHED )) -ge 600 ]; then
              push_archive
              ARCHIVE_PUSHED=$(date +%s)
            fi

            ELAPSED=$(( $(date +%s) - START ))
            SLEEP=$(( 60 - ELAPSED ))
            [ "$SLEEP" -lt 5 ] && SLEEP=5
            [ "$(date +%s)" -ge "$END" ] && break
            sleep "$SLEEP"
          done

          push_archive
          echo "loop finished: $OK refreshed, $FAIL failed"
          # a run where nothing succeeded is a real failure worth surfacing
          [ "$OK" -gt 0 ]
