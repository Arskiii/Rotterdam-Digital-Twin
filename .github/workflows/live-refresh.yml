name: Live snapshot refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-refresh
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch live snapshot
        run: node scripts/fetch-live.mjs --out /tmp/live.json
      - name: Publish to the live branch
        run: |
          mkdir /tmp/live-branch
          cp /tmp/live.json /tmp/live-branch/live.json
          printf '{"git":{"deploymentEnabled":{"live":false}}}' > /tmp/live-branch/vercel.json
          cd /tmp/live-branch
          git init -b live
          git config user.name "live-data bot"
          git config user.email "actions@github.com"
          git add live.json vercel.json
          git commit -m "live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
