name: Deploy to GitHub Pages

# Build on every push to main so we always know the build is healthy; only
# `main` publishes to Pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the live job should keep refreshing (1-55)"
        required: false
        default: "25"
  # The live refresh rides in this workflow because this is the only file in
  # this repo whose cron actually fires. live-refresh.yml was added as its own
  # workflow and its schedule never armed; deploy.yml's has been firing all
  # along. Keep the job here until that changes.
  #
  # "*/5" is aspirational and always was: GitHub throttles short crons hard, and
  # the observed firings were 09:00, 09:40, 10:04 — twenty to forty minutes
  # apart, not five. The `live` job therefore refreshes on a loop for the length
  # of its run rather than once per firing, which is what actually keeps the
  # snapshot fresh between sparse ticks.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write # the live job force-pushes the `live` branch
  pages: write
  id-token: write

concurrency:
  # Schedule ticks get their own group so a refresh can never cancel a deploy,
  # and a push can never kill a refresh mid-write.
  group: ${{ github.event_name == 'schedule' && 'live-data' || format('pages-{0}', github.ref) }}
  # A newer push should replace an older in-flight deploy, but a refresh loop
  # must never be killed by the next tick — with sparse firings that would be
  # the difference between continuous coverage and none. A queued tick simply
  # takes over when the running loop ends.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          # Auto-enable Pages on the repo on first deploy so no manual setup is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publish the live city snapshot to the `live` branch, force-pushed as one
  # root commit so its history never grows.
  #
  # The vercel.json is not optional. `live` holds data, not an app, so without
  # it Vercel's git integration builds the branch on every push and fails —
  # that is what produced a failed deployment every five minutes on 20 Aug.
  # Any future publisher of this branch must write it too.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh loop
        env:
          MINUTES: ${{ github.event.inputs.minutes || '25' }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -uo pipefail
          MINUTES=$(echo "$MINUTES" | tr -cd '0-9')
          [ -z "$MINUTES" ] && MINUTES=25
          [ "$MINUTES" -gt 55 ] && MINUTES=55
          [ "$MINUTES" -lt 1 ] && MINUTES=1
          END=$(( $(date +%s) + MINUTES * 60 ))
          # 120s, not 60s: raw.githubusercontent.com serves the live branch with
          # cache-control max-age=300, and a cache-busting query string does not
          # get past it (verified — x-cache: HIT either way). Five minutes is
          # therefore a hard floor on how fresh the browser can see this data,
          # so publishing more often than every couple of minutes buys nothing
          # downstream and just doubles the load on NDW and OVapi, who serve
          # these feeds for free.
          CADENCE=120
          echo "refreshing every ${CADENCE}s for ${MINUTES} minute(s)"

          mkdir -p /tmp/live-branch
          OK=0
          FAIL=0

          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)
            if node scripts/fetch-live.mjs --out /tmp/live.json; then
              OK=$((OK + 1))
              cp /tmp/live.json /tmp/live-branch/live.json
              printf '{"git":{"deploymentEnabled":{"live":false}}}' > /tmp/live-branch/vercel.json
              ( cd /tmp/live-branch
                rm -rf .git
                git init -b live --quiet
                git config user.name "live-data bot"
                git config user.email "actions@github.com"
                git add live.json vercel.json
                git commit -q -m "live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git push -q --force "$REPO_URL" live ) || echo "  live push failed"
            else
              FAIL=$((FAIL + 1))
              echo "  fetch failed ($FAIL so far)"
            fi
            ELAPSED=$(( $(date +%s) - START ))
            SLEEP=$(( CADENCE - ELAPSED ))
            [ "$SLEEP" -lt 5 ] && SLEEP=5
            [ "$(date +%s)" -ge "$END" ] && break
            sleep "$SLEEP"
          done

          echo "loop finished: $OK refreshed, $FAIL failed"
          # a run where nothing succeeded is a real failure worth surfacing
          [ "$OK" -gt 0 ]
