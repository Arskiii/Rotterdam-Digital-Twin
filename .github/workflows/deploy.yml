name: Deploy to GitHub Pages

# Build on every push to main or the active dev branch so we always know
# the build is healthy. Only publish to Pages from `main` — the dev branch
# can't deploy unless its branch is added under
#   Settings -> Environments -> github-pages -> Deployment branches.
on:
  push:
    branches:
      - main
      - claude/rotterdam-traffic-simulation-PL88s
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Per-ref so a dev-branch build can't cancel an in-flight main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find retained observation history
        id: history
        uses: actions/github-script@v7
        with:
          script: |
            const findHistory = require('./scripts/find_history_artifact.cjs');
            await findHistory({ github, context, core });
      - name: Restore retained observation history
        if: steps.history.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: traffic-history-v1
          path: public/data
          run-id: ${{ steps.history.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/cache/restore@v4
        if: steps.history.outputs.run-id == ''
        with:
          path: public/data/traffic-history.json
          key: traffic-history-${{ github.run_id }}
          restore-keys: traffic-history-
      - run: python3 scripts/update_public_data.py
      - run: python3 scripts/update_history.py
      # Preserve observations even when a later freshness check or site build fails.
      - name: Retain observation history
        uses: actions/upload-artifact@v4
        with:
          name: traffic-history-v1
          path: public/data/traffic-history.json
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      - run: python3 scripts/check_public_data.py
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run build
        env:
          VITE_LIVE_SIGNALS_URL: ${{ vars.LIVE_SIGNALS_URL }}
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
        with:
          # Auto-enable Pages on the repo on first deploy so no manual setup is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
