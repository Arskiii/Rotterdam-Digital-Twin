name: Deploy to GitHub Pages

# Build on every push to main so we always know the build is healthy; only
# `main` publishes to Pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the live job should keep refreshing (1-55)"
        required: false
        default: "25"
  # The live refresh rides in this workflow because this is the only file in
  # this repo whose cron actually fires. live-refresh.yml was added as its own
  # workflow and its schedule never armed; deploy.yml's has been firing all
  # along. Keep the job here until that changes.
  #
  # "*/5" is aspirational and always was: GitHub throttles short crons hard, and
  # the observed firings were 09:00, 09:40, 10:04 — twenty to forty minutes
  # apart, not five. That is why the `live` job loops for the length of its run
  # instead of fetching once per firing.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write # the live job force-pushes the `live` branch
  pages: write
  id-token: write

concurrency:
  # Schedule ticks get their own group so a refresh can never cancel a deploy,
  # and a push can never kill a refresh mid-write.
  group: ${{ github.event_name == 'schedule' && 'live-data' || format('pages-{0}', github.ref) }}
  # A newer push should replace an older in-flight deploy, but a refresh loop
  # must never be killed by the next tick — with firings this sparse that is
  # the difference between continuous coverage and none. A queued tick takes
  # over when the running loop ends.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
        with:
          # Auto-enable Pages on the repo on first deploy so no manual setup is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The timetable behind every moving vehicle and every departure board, kept
  # from going stale.
  #
  # It is an 8 MB binary built from two streams of a 1 GB file, so it cannot be
  # rebuilt per refresh; and committing it weekly would put 400 MB of binary
  # into git history a year. So it lives in the Actions cache under a key that
  # turns over with the ISO week: every tick restores it in seconds, and the
  # first tick of a new week pays the four minutes to rebuild.
  #
  # Decay here is silent, which is why it is worth a job at all. A route_id
  # missing from the route table is a vehicle dropped from the snapshot
  # outright; a trip whose calendar has run out is a vehicle frozen on the map.
  # Neither raises an error — the city just gets quieter.
  #
  # A rebuild that produces something worse than what we already have must not
  # be kept: check-timetable gates it, so a bad feed leaves the committed files
  # in place rather than caching a broken artifact for the rest of the week.
  timetable:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Which week is it
        id: wk
        run: echo "key=gtfs-v1-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore this week's timetable
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            data/ret-timetable.bin
            data/gtfs-stops.json
            data/gtfs-routes.json
          key: ${{ steps.wk.outputs.key }}

      - name: Rebuild, because the week has turned
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm run fetch-routes
          npm run fetch-stops
          npm run fetch-timetable
          # has to cover the fortnight ahead, or it does not get cached
          npm run check-timetable -- --days 14

      - name: Say what we have
        run: npm run check-timetable

  # Publish the live city snapshot to the `live` branch and fold it into the
  # historical archive on the `archive` branch.
  #
  # The vercel.json on each branch is not optional. Both hold data, not an app,
  # so without it Vercel's git integration builds them on every push and fails
  # — that is what produced a failed deployment every five minutes on 20 Aug.
  # Any future publisher of these branches must write it too.
  #
  # The job loops internally rather than fetching once and exiting: a single
  # tick leaves a snapshot that is already minutes old by the time anyone loads
  # the page. Refreshing on a 60-second cadence for the run means the city
  # stays a minute fresh. The default duration is shorter than the cron
  # interval on purpose — the schedule concurrency group cancels in progress,
  # so a loop that outran its tick would simply be killed by the next one.
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Two different ceilings because the two callers want different things. On a
    # tick this is a watchdog: the default loop is 25 minutes, so anything past
    # 32 is a wedged fetch sitting on the live-data group, and killing it lets
    # the next tick take over. A dispatch is allowed to ask for up to 55
    # (`minutes`, above), which that same watchdog would kill mid-loop — losing
    # the final archive push with it — so it gets a ceiling that fits what the
    # input already promises.
    timeout-minutes: ${{ github.event_name == 'schedule' && 32 || 60 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Whatever the timetable job last built. Restore-only: this job never
      # writes the cache, so a run cancelled mid-loop cannot save a half-built
      # one. A miss simply leaves the committed files, which is the floor.
      - name: Which week is it
        id: wk
        run: echo "key=gtfs-v1-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with:
          path: |
            data/ret-timetable.bin
            data/gtfs-stops.json
            data/gtfs-routes.json
          key: ${{ steps.wk.outputs.key }}

      - name: Check out the archive branch
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git clone --depth 1 --branch archive "$REPO" /tmp/archive 2>/dev/null; then
            echo "archive branch checked out ($(du -sh /tmp/archive | cut -f1))"
          else
            echo "archive branch does not exist yet — starting one"
            mkdir -p /tmp/archive
            git -C /tmp/archive init -b archive --quiet
          fi
          git -C /tmp/archive config user.name "live-data bot"
          git -C /tmp/archive config user.email "actions@github.com"

      - name: Refresh loop
        env:
          MINUTES: ${{ github.event.inputs.minutes || '25' }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -uo pipefail
          MINUTES=$(echo "$MINUTES" | tr -cd '0-9')
          [ -z "$MINUTES" ] && MINUTES=25
          [ "$MINUTES" -gt 55 ] && MINUTES=55
          [ "$MINUTES" -lt 1 ] && MINUTES=1
          END=$(( $(date +%s) + MINUTES * 60 ))
          # 120s, not 60s: raw.githubusercontent.com serves the live branch with
          # cache-control max-age=300, and a cache-busting query string does not
          # get past it (verified — x-cache: HIT either way, identical body).
          # Five minutes is a hard floor on how fresh the browser can see this,
          # so publishing faster buys nothing downstream and only doubles the
          # load on NDW and OVapi, who serve these feeds for free.
          CADENCE=120
          echo "refreshing every ${CADENCE}s for ${MINUTES} minute(s)"

          VERCEL_LIVE='{"git":{"deploymentEnabled":{"live":false}}}'
          VERCEL_ARCHIVE='{"git":{"deploymentEnabled":{"archive":false}}}'

          mkdir -p /tmp/live-branch
          printf '%s' "$VERCEL_ARCHIVE" > /tmp/archive/vercel.json
          ARCHIVE_PUSHED=$(date +%s)
          OK=0
          FAIL=0

          push_archive() {
            if [ -n "$(git -C /tmp/archive status --porcelain)" ]; then
              git -C /tmp/archive add -A
              git -C /tmp/archive commit -q -m "archive $(date -u +%Y-%m-%dT%H:%MZ)"
              # append-mostly, so a losing race just means the next push carries
              # both sides — rebase rather than force
              git -C /tmp/archive pull --rebase -q origin archive 2>/dev/null || true
              if git -C /tmp/archive push -q "$REPO_URL" archive 2>&1; then
                echo "  archive pushed"
              else
                echo "  archive push failed (will retry next window)"
              fi
            fi
          }

          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)
            if node scripts/fetch-live.mjs --out /tmp/live.json; then
              OK=$((OK + 1))
              cp /tmp/live.json /tmp/live-branch/live.json
              printf '%s' "$VERCEL_LIVE" > /tmp/live-branch/vercel.json
              ( cd /tmp/live-branch
                rm -rf .git
                git init -b live --quiet
                git config user.name "live-data bot"
                git config user.email "actions@github.com"
                git add live.json vercel.json
                git commit -q -m "live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                # one root commit, force-pushed: the live branch is a current
                # value, not a log, so its history must never grow
                git push -q --force "$REPO_URL" live ) || echo "  live push failed"
              node scripts/archive-live.mjs --snapshot /tmp/live.json --dir /tmp/archive || true
            else
              FAIL=$((FAIL + 1))
              echo "  fetch failed ($FAIL so far)"
            fi

            if [ $(( $(date +%s) - ARCHIVE_PUSHED )) -ge 300 ]; then
              push_archive
              ARCHIVE_PUSHED=$(date +%s)
            fi

            ELAPSED=$(( $(date +%s) - START ))
            SLEEP=$(( CADENCE - ELAPSED ))
            [ "$SLEEP" -lt 5 ] && SLEEP=5
            [ "$(date +%s)" -ge "$END" ] && break
            sleep "$SLEEP"
          done

          push_archive
          echo "loop finished: $OK refreshed, $FAIL failed"
          # a run where nothing succeeded is a real failure worth surfacing
          [ "$OK" -gt 0 ]
