name: Deploy to GitHub Pages

# Collection runs continuously on Railway. GitHub only builds/deploys the site;
# it must never be the clock for observation capture.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
        env:
          VITE_LIVE_SIGNALS_URL: ${{ vars.LIVE_SIGNALS_URL }}
          VITE_OBSERVATION_API_URL: ${{ vars.OBSERVATION_API_URL }}
          VITE_CORRIDOR_SIGNALS_URL: ${{ vars.CORRIDOR_SIGNALS_URL }}
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
        with:
          # Auto-enable Pages on the repo on first deploy so no manual setup is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
