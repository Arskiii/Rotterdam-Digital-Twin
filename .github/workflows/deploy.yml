name: Deploy to GitHub Pages

# Build on every push to main so we always know the build is healthy; only
# `main` publishes to Pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref so a dev-branch build can't cancel an in-flight main deploy. Note
  # this is deliberately not keyed on event name: a push and a manual dispatch
  # on the same ref build the same thing, and letting them share a group used
  # to mean a dispatch would cancel the push mid-deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # No `enablement: true` here: Pages is enabled on the repo, and asking
      # the action to enable it again is what failed the 08:25 run on 20 Aug,
      # taking the whole build down with it.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
